    <meta property="og:title" content="VidAI Creator - AI Video Translation" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- ✅ Paystack Script - Already loaded at top, this is a fallback check -->
    <script>
      // Check if Paystack loaded after 3 seconds
      setTimeout(function() {
        if (typeof window.PaystackPop === 'undefined') {
          console.warn('⚠️ Paystack script not loaded, reloading from CDN...');
          var script = document.createElement('script');
          script.src = 'https://js.paystack.co/v1/inline.js';
          script.async = true;
          script.onload = function() {
            console.log('✅ Paystack script reloaded successfully!');
          };
          document.head.appendChild(script);
        } else {
          console.log('✅ Paystack script already loaded!');
        }
      }, 3000);
    </script>
